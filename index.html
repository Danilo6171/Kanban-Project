<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadro Kanban</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">▦</div><h1>Quadro Kanban</h1></div>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Buscar tarefas" aria-label="Buscar tarefas">
      <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
      <button class="primary" id="newBtn">+ Nova tarefa</button>
    </div>
  </header>

  <section class="progress" aria-label="Progresso geral">
    <div class="pct" id="pct">0%</div>
    <div class="pbody"><div class="sum" id="sum"></div><div class="track"><div id="bar"></div></div></div>
  </section>

  <main class="board">
    <section class="column todo" data-status="todo"><div class="col-head"><span class="dot"></span>A Fazer<span class="count" id="todo-count">0</span></div><div class="list" id="todo-list"></div></section>
    <section class="column doing" data-status="doing"><div class="col-head"><span class="dot"></span>Em Andamento<span class="count" id="doing-count">0</span></div><div class="list" id="doing-list"></div></section>
    <section class="column done" data-status="done"><div class="col-head"><span class="dot"></span>Concluído<span class="count" id="done-count">0</span></div><div class="list" id="done-list"></div></section>
  </main>
</div>

<dialog id="dlg">
  <div class="dlg">
    <h2 id="dlgTitle">Nova tarefa</h2>
    <form id="taskForm">
      <label for="taskTitle">Título</label>
      <input type="text" id="taskTitle" required maxlength="80" placeholder="Ex: Estudar JavaScript">
      <label for="taskDesc">Descrição</label>
      <textarea id="taskDesc" rows="3" placeholder="Ex: Ler o capítulo 3 do livro"></textarea>
      <label for="taskPriority">Prioridade</label>
      <select id="taskPriority"><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option></select>
      <div class="row"><button type="button" class="ghost" id="cancelBtn">Cancelar</button><button type="submit" class="primary">Salvar tarefa</button></div>
    </form>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
